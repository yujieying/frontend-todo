<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的待办清单</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">
          <span class="title-icon" aria-hidden="true">🐻</span>
          我的待办清单
        </h1>
        <p class="subtitle">记录今天要做的事</p>
      </header>

      <form class="add-form" id="addForm" autocomplete="off">
        <div class="add-form-fields">
          <label class="field-label" for="taskTitleInput">待办标题</label>
          <input
            type="text"
            id="taskTitleInput"
            class="task-input task-input-title"
            placeholder="简短标题，例如：写周报"
            maxlength="200"
            required
            aria-label="待办标题"
          />
          <label class="field-label field-label-optional" for="taskDescInput">
            待办描述<span class="optional-hint">（选填）</span>
          </label>
          <textarea
            id="taskDescInput"
            class="task-input task-input-desc"
            placeholder="补充细节、截止时间、注意事项等"
            maxlength="500"
            rows="2"
            aria-label="待办描述（选填）"
          ></textarea>
        </div>
        <div class="add-form-extra">
          <span id="addPriorityLegend" class="priority-label">优先级</span>
          <div
            class="add-priority-buttons"
            role="radiogroup"
            aria-labelledby="addPriorityLegend"
          >
            <label class="priority-btn priority-btn--high">
              <input
                type="radio"
                name="addPriority"
                value="high"
                aria-label="优先级：高"
              />
              <span class="priority-btn-text">高</span>
            </label>
            <label class="priority-btn priority-btn--medium">
              <input
                type="radio"
                name="addPriority"
                value="medium"
                checked
                aria-label="优先级：中"
              />
              <span class="priority-btn-text">中</span>
            </label>
            <label class="priority-btn priority-btn--low">
              <input
                type="radio"
                name="addPriority"
                value="low"
                aria-label="优先级：低"
              />
              <span class="priority-btn-text">低</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary add-form-submit">
          ➕ 添加任务
        </button>
      </form>

      <div class="stats-wrap">
        <div class="stats" role="status" aria-live="polite">
          <span class="stat stat-pending">
            <span class="stat-value" id="pendingCount">0</span>
            <span class="stat-label">未完成</span>
          </span>
          <span class="stat stat-done">
            <span class="stat-value" id="doneCount">0</span>
            <span class="stat-label">已完成</span>
          </span>
        </div>
        <div class="bulk-actions">
          <button
            type="button"
            class="btn btn-clear-done"
            id="clearDoneBtn"
            disabled
            aria-label="清空所有已完成的任务"
          >
            清空已完成
          </button>
          <button
            type="button"
            class="btn btn-clear-all"
            id="clearAllBtn"
            disabled
            aria-label="清空全部任务"
          >
            全部清空
          </button>
        </div>
      </div>

      <div class="task-list-toolbar hidden" id="taskListToolbar">
        <button
          type="button"
          class="btn-toggle-desc"
          id="toggleDescBtn"
          aria-pressed="false"
          aria-controls="taskList"
          aria-label="切换是否显示描述、创建时间与完成时间"
        >
          显示详情
        </button>
      </div>

      <ul class="task-list" id="taskList" aria-label="任务列表"></ul>

      <div class="empty-state" id="emptyState" role="status" aria-live="polite">
        <div class="empty-icon" aria-hidden="true">📭</div>
        <p class="empty-title">这里空空如也</p>
        <p class="empty-desc">
          太好了，暂时没有待办。填写标题（必填）和描述（选填），选好优先级后点「➕
          添加任务」即可。
        </p>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
